<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" preserveAspectRatio="none">
  <defs>
    <filter id="brush" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.32" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#EDBE72"/>
      <stop offset="0.16" stop-color="#F8DCA3"/>
      <stop offset="0.5" stop-color="#FFF0CC"/>
      <stop offset="0.84" stop-color="#F8DCA3"/>
      <stop offset="1" stop-color="#E9B767"/>
    </linearGradient>
  </defs>
  <rect x="14" y="12" width="612" height="106" rx="4" fill="url(#paper)" filter="url(#brush)"/>
</svg>
